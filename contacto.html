<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Miguel López León</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        if (localStorage.getItem("tema") === "oscuro") {
            document.documentElement.classList.add("oscuro");
        }
    </script>
</head>
<body>
    <header>
        <div class="barra">
            <a href="index.html" class="logo">
                <span class="logo-letra">MLL</span>
                <span class="logo-nombre">MIGUEL LÓPEZ LEÓN</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html" data-i18n="nav-inicio">INICIO</a></li>
                    <li><a href="portafolio.html" data-i18n="nav-portafolio">PORTAFOLIO</a></li>
                    <li><a href="curriculum.html" data-i18n="nav-curriculum">CURRICULUM</a></li>
                    <li><a href="contacto.html" class="activo" data-i18n="nav-contacto">CONTACTO</a></li>
                </ul>
            </nav>
            <div class="utiles">
                <button type="button" class="btn-util" id="btn-idioma">ES</button>
                <button type="button" class="btn-util" id="btn-tema">☾</button>
            </div>
        </div>
    </header>
    <main>
        <section id="contacto" class="contacto">
            <h2 data-i18n="contacto-titulo">Contacto</h2>
            <div class="contacto-grid">
                <form class="formulario" id="formulario">
                    <input type="hidden" name="access_key" value="bca43740-280f-452f-8e78-7fd8f1b93608">
                    <input type="hidden" name="subject" value="Nuevo mensaje desde el portafolio">
                    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                    <label for="nombre" data-i18n="ph-nombre">Nombre</label>
                    <input type="text" id="nombre" name="name" data-i18n-ph="ph-nombre" placeholder="Nombre" required>

                    <label for="apellidos" data-i18n="ph-apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" data-i18n-ph="ph-apellidos" placeholder="Apellidos">

                    <label for="email" data-i18n="ph-email">Email</label>
                    <input type="email" id="email" name="email" data-i18n-ph="ph-email" placeholder="Email" required>

                    <label for="telefono" data-i18n="ph-telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" data-i18n-ph="ph-telefono" placeholder="Teléfono">

                    <label for="motivo" data-i18n="ph-motivo">Motivo de contacto</label>
                    <textarea id="motivo" name="message" rows="6" data-i18n-ph="ph-motivo" placeholder="Motivo de contacto" required></textarea>

                    <p class="estado-form" id="estado-form" aria-live="polite"></p>
                    <button type="submit" data-i18n="enviar">Enviar</button>
                </form>
                <aside class="contacto-info">
                    <h3 data-i18n="redes">Sígueme en redes</h3>
                    <p><a href="https://linkedin.com/in/miguel-lópez-león-2a3794136/" target="_blank">LinkedIn</a></p>
                    <p><a href="https://github.com/milogades" target="_blank">GitHub</a></p>
                    <h3 data-i18n="info">Información de contacto</h3>
                    <p><a href="mailto:milo.gadir@gmail.com">milo.gadir@gmail.com</a></p>
                    <p><a href="tel:+34670104201">+34 670 104 201</a></p>
                </aside>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 Miguel López León · Cádiz</p>
    </footer>
    <script src="extra.js"></script>
</body>
</html>
